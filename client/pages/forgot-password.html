<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – Neko Animestore</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <!-- LEFT PANEL -->
        <div class="auth-panel left-panel">
            <a href="index.html" class="panel-logo">
                <img src="https://i.pinimg.com/736x/d1/44/68/d14468697401a86272d2b631e6f62069.jpg" alt="Neko Logo">
                <span>Neko_Animestore</span>
            </a>
            <div class="panel-text">
                <h2>Forgot your password?</h2>
                <p>No worries! We'll send you<br>a reset link.</p>
            </div>
            <div class="panel-decoration">
                <div class="deco-circle c1"></div>
                <div class="deco-circle c2"></div>
                <div class="deco-circle c3"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="auth-panel right-panel">
            <div class="form-card">
                <div id="forgot-form-view">
                    <h1 class="form-title">Reset Password</h1>
                    <p class="form-subtitle">Enter your email and we'll send you a reset link.</p>

                    <div class="auth-error" id="auth-error" style="display:none;">
                        <i class="fas fa-circle-exclamation"></i>
                        <span id="auth-error-msg"></span>
                    </div>

                    <form id="forgot-form" novalidate>
                        <div class="field-group">
                            <label for="email">Email</label>
                            <div class="input-wrap">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                            </div>
                            <span class="field-error" id="email-error"></span>
                        </div>

                        <button type="submit" class="submit-btn" id="forgot-btn">
                            <span id="forgot-btn-text">Send Reset Link</span>
                            <span class="spinner" id="forgot-spinner" style="display:none;"></span>
                        </button>
                    </form>

                    <p class="form-subtitle" style="margin-top:20px; margin-bottom:0;">
                        Remember your password? <a href="login.html">Log in</a>
                    </p>
                </div>

                <div id="forgot-success-view" style="display:none;">
                    <div class="status-content">
                        <div class="status-icon info">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                        <h2 class="status-title">Check your email</h2>
                        <p class="status-message">
                            We've sent a password reset link to <strong id="sent-email"></strong>.<br>
                            The link expires in <strong>20 minutes</strong>.
                        </p>
                        <div class="status-actions">
                            <a href="login.html" class="submit-btn" style="text-decoration:none; max-width:280px;">Back to Log In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('forgot-form');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideBanners();
            clearError('email-error');
            setInputState('email', null);

            const email = document.getElementById('email')?.value.trim();

            if (!email) {
                showError('email-error', 'Email is required.');
                setInputState('email', 'input-error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('email-error', 'Please enter a valid email.');
                setInputState('email', 'input-error');
                return;
            }

            setLoading('forgot-btn', 'forgot-btn-text', 'forgot-spinner', true);
            try {
                const res = await fetch(`${API}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();

                if (!res.ok) {
                    showBanner('error', data.error || 'Something went wrong.');
                    return;
                }

                // Show success
                document.getElementById('forgot-form-view').style.display = 'none';
                document.getElementById('forgot-success-view').style.display = 'block';
                document.getElementById('sent-email').textContent = email;

            } catch (err) {
                showBanner('error', 'Network error — make sure the server is running.');
            } finally {
                setLoading('forgot-btn', 'forgot-btn-text', 'forgot-spinner', false);
            }
        });
    });
    </script>
</body>
</html>
