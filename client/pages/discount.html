<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounts – Neko Animestore</title>
    <link rel="stylesheet" href="../css/customer.css">
    <link rel="stylesheet" href="../css/productlist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="header-root"></div>

    <!-- SCROLLABLE CAROUSEL / NAV BAR -->
    <section class="carousel-section">
        <div class="carousel-wrapper">
            <div class="carousel-track">
                <a href="#page-1" class="carousel-button">Page 1</a>
                <a href="#page-2" class="carousel-button">Page 2</a>
                <a href="#page-3" class="carousel-button">Page 3</a>
                <a href="#page-4" class="carousel-button">Page 4</a>
                <a href="#page-5" class="carousel-button">Page 5</a>
                <a href="#page-6" class="carousel-button">Page 6</a>
                <a href="#page-7" class="carousel-button">Page 7</a>
                <a href="#page-8" class="carousel-button">Page 8</a>
            </div>
        </div>
    </section>

    <!-- PAGE BANNER (design this yourself later) -->
    <div class="page-banner" id="page-banner">
        <!-- Your banner content goes here -->
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="container">
            <div class="product-grid" id="product-grid">
                <!-- Cards injected by productlist.js -->
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="empty-state" style="display:none;">
                <p>No products found.</p>
            </div>
        </div>
    </main>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

<div id="footer-root"></div>

    <script>
        window.PAGE_FILTER = { promotion: 'discount' };
        </script>

    <script src="../js/partials.js"></script>
    <script src="../js/productlist.js"></script>
</body>
</html>
