<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Neko Animestore</title>
    <link rel="stylesheet" href="../css/customer.css">
    <link rel="stylesheet" href="../css/userpage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="header-flex desktop-header">
                    <div class="header-socials">
                        <a href="https://www.facebook.com/Nekoanimestore.kh" target="_blank" title="Facebook">
                            <img src="https://i.pinimg.com/736x/7e/a3/bd/7ea3bd759d038651d0b9efa55d07bb8f.jpg" alt="Facebook">
                        </a>
                        <a href="https://www.instagram.com/nekoanimestore.kh/" target="_blank" title="Instagram">
                            <img src="https://i.pinimg.com/736x/fc/49/56/fc4956e4c15da83905e7f1c2481e9b90.jpg" alt="Instagram">
                        </a>
                        <a href="https://www.tiktok.com/@nekoanimestore.kh" target="_blank" title="TikTok">
                            <img src="https://i.pinimg.com/736x/b9/92/06/b99206653417284b71702a76774be1fc.jpg" alt="TikTok">
                        </a>
                    </div>
                    <div class="logo-section">
                        <a href="index.html">
                            <img src="https://i.pinimg.com/736x/d1/44/68/d14468697401a86272d2b631e6f62069.jpg" alt="Neko Logo" class="logo-img">
                        </a>
                        <span class="logo-text">Neko_Animestore</span>
                    </div>
                    <div class="right-section">
                        <div class="search-box">
                            <input type="text" placeholder="Search...">
                        </div>
                        <div class="header-icons">
                            <a href="cart.html" class="icon-link" title="Cart">
                                <img src="https://i.pinimg.com/736x/a8/55/11/a855111b1cef5fc7d045fdab7892fde2.jpg" alt="Cart" class="icon-img">
                            </a>
                            <a href="user.html" class="icon-link" title="User">
                                <img src="https://i.pinimg.com/736x/09/9b/de/099bdea361336b894f410cdf67c777e4.jpg" alt="User" class="icon-img">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="mobile-header">
                    <div class="logo-section-mobile">
                        <a href="index.html">
                            <img src="https://i.pinimg.com/736x/d1/44/68/d14468697401a86272d2b631e6f62069.jpg" alt="Neko Logo" class="logo-img-mobile">
                        </a>
                        <span class="logo-text-mobile">Neko_Animestore</span>
                    </div>
                    <div class="search-box-mobile">
                        <input type="text" placeholder="Search...">
                    </div>
                    <div class="header-icons-mobile">
                        <a href="cart.html" class="icon-link" title="Cart">
                            <img src="https://i.pinimg.com/736x/a8/55/11/a855111b1cef5fc7d045fdab7892fde2.jpg" alt="Cart" class="icon-img">
                        </a>
                        <a href="userpage.html" class="icon-link" title="User">
                            <img src="https://i.pinimg.com/736x/09/9b/de/099bdea361336b894f410cdf67c777e4.jpg" alt="User" class="icon-img">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="up-main-wrap">
        <div class="container">
            <div class="up-layout">

                <!-- SIDEBAR -->
                <aside class="up-sidebar">
                    <div class="up-avatar-block">
                        <div class="up-avatar-circle" id="sidebar-initials">--</div>
                        <div class="up-avatar-name" id="sidebar-name">Loading…</div>
                        <div class="up-avatar-id" id="sidebar-id"></div>
                    </div>

                    <nav class="up-nav">
                        <div class="up-nav-label">Account</div>
                        <button class="up-nav-item active" data-panel="orders" onclick="switchPanel('orders', this)">
                            <i class="fas fa-box-open"></i>
                            <span>My orders</span>
                        </button>
                        <button class="up-nav-item" data-panel="settings" onclick="switchPanel('settings', this)">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </button>
                    </nav>

                    <div class="up-sidebar-bottom">
                        <button class="up-logout-btn" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Sign out</span>
                        </button>
                    </div>
                </aside>

                <!-- PANELS -->
                <div class="up-content">

                    <!-- ── ORDERS PANEL ── -->
                    <div class="up-panel active" id="panel-orders">
                        <div class="up-panel-header">
                            <h2 class="up-panel-title">My orders</h2>
                        </div>

                        <!-- Ship notification toggle -->
                        <div class="notif-banner" id="notif-banner">
                            <div class="notif-banner-left">
                                <i class="fas fa-bell"></i>
                                <div>
                                    <div class="notif-banner-title">Shipping notifications</div>
                                    <div class="notif-banner-sub">Get notified when your order ships</div>
                                </div>
                            </div>
                            <label class="up-toggle" title="Toggle shipping notifications">
                                <input type="checkbox" id="notif-toggle" checked onchange="saveNotifPref(this.checked)">
                                <span class="up-toggle-track"></span>
                            </label>
                        </div>

                        <!-- Status filter tabs -->
                        <div class="status-tabs" role="tablist" aria-label="Filter orders by status">
                            <button class="stab active" data-status="all"       onclick="setOrderTab(this)">All</button>
                            <button class="stab"         data-status="pending"  onclick="setOrderTab(this)">Awaiting confirmation</button>
                            <button class="stab"         data-status="confirmed" onclick="setOrderTab(this)">Confirmed</button>
                            <button class="stab"         data-status="shipped"  onclick="setOrderTab(this)">Shipped</button>
                            <button class="stab"         data-status="delivered" onclick="setOrderTab(this)">Delivered</button>
                            <button class="stab"         data-status="cancelled" onclick="setOrderTab(this)">Cancelled</button>
                        </div>

                        <div id="orders-list">
                            <div class="up-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading orders…</div>
                        </div>
                    </div>

                    <!-- ── SETTINGS PANEL ── -->
                    <div class="up-panel" id="panel-settings">
                        <div class="up-panel-header">
                            <h2 class="up-panel-title">Settings</h2>
                        </div>

                        <!-- Account info -->
                        <div class="setting-card">
                            <div class="setting-card-title">Account info</div>

                            <div class="setting-row">
                                <div class="setting-label"><i class="fas fa-id-badge"></i> User ID</div>
                                <div class="setting-val" id="s-user-id">—</div>
                            </div>
                            <div class="setting-row">
                                <div class="setting-label"><i class="fas fa-user"></i> Username</div>
                                <div class="setting-val" id="s-username">—</div>
                            </div>
                            <div class="setting-row">
                                <div class="setting-label"><i class="fas fa-envelope"></i> Email</div>
                                <div class="setting-row-right">
                                    <span class="setting-val" id="s-email">—</span>
                                    <button class="edit-btn" onclick="openEditModal('email')">Edit</button>
                                </div>
                            </div>
                            <div class="setting-row">
                                <div class="setting-label"><i class="fas fa-phone"></i> Phone</div>
                                <div class="setting-row-right">
                                    <span class="setting-val" id="s-phone">—</span>
                                    <button class="edit-btn" onclick="openEditModal('phone')">Edit</button>
                                </div>
                            </div>
                            <div class="setting-row" style="border-bottom:none">
                                <div class="setting-label"><i class="fab fa-telegram-plane"></i> Telegram</div>
                                <div class="setting-row-right">
                                    <span class="setting-val" id="s-telegram" style="font-size:12px">Not connected</span>
                                    <button class="edit-btn edit-btn-blue" id="tg-connect-btn" onclick="openEditModal('telegram')">Connect</button>
                                </div>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="setting-card">
                            <div class="setting-card-title">Change password</div>
                            <div class="pwd-methods">
                                <button class="pwd-method" onclick="openEditModal('password-current')">
                                    <div class="pwd-method-icon"><i class="fas fa-lock"></i></div>
                                    <div class="pwd-method-text">
                                        <div class="pwd-method-label">Use current password</div>
                                        <div class="pwd-method-sub">Enter your old password to set a new one</div>
                                    </div>
                                    <i class="fas fa-chevron-right pwd-method-arrow"></i>
                                </button>
                                <button class="pwd-method" onclick="openEditModal('password-telegram')">
                                    <div class="pwd-method-icon"><i class="fab fa-telegram-plane"></i></div>
                                    <div class="pwd-method-text">
                                        <div class="pwd-method-label">Via Telegram bot</div>
                                        <div class="pwd-method-sub">Receive a reset code from @NekoBot</div>
                                    </div>
                                    <i class="fas fa-chevron-right pwd-method-arrow"></i>
                                </button>
                                <button class="pwd-method pwd-method-disabled" disabled>
                                    <div class="pwd-method-icon"><i class="fas fa-envelope"></i></div>
                                    <div class="pwd-method-text">
                                        <div class="pwd-method-label">Via email</div>
                                        <div class="pwd-method-sub">Coming soon</div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- ── ORDER EDIT ADDRESS MODAL ── -->
    <div class="up-modal-overlay" id="addr-modal" role="dialog" aria-modal="true" aria-labelledby="addr-modal-title">
        <div class="up-modal">
            <div class="up-modal-header">
                <h3 class="up-modal-title" id="addr-modal-title">Update delivery info</h3>
                <button class="up-modal-close" onclick="closeAddrModal()" aria-label="Close">&times;</button>
            </div>
            <div class="up-modal-body">
                <p class="up-modal-sub" id="addr-modal-ordcode"></p>
                <div class="form-group">
                    <label>Phone number</label>
                    <input type="text" id="addr-phone1" placeholder="+855 xx xxx xxx">
                </div>
                <div class="form-group">
                    <label>Address line</label>
                    <input type="text" id="addr-line1" placeholder="Street, house number">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>District</label>
                        <input type="text" id="addr-district">
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="addr-city">
                    </div>
                </div>
                <div class="form-group">
                    <label>Landmark <span class="form-optional">(optional)</span></label>
                    <input type="text" id="addr-landmark" placeholder="Near the blue gate…">
                </div>
            </div>
            <div class="up-modal-footer">
                <button class="up-btn-cancel" onclick="closeAddrModal()">Cancel</button>
                <button class="up-btn-save" onclick="saveAddrEdits()">Save changes</button>
            </div>
        </div>
    </div>

    <!-- ── PROFILE EDIT MODAL ── -->
    <div class="up-modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="up-modal">
            <div class="up-modal-header">
                <h3 class="up-modal-title" id="edit-modal-title">Edit</h3>
                <button class="up-modal-close" onclick="closeEditModal()" aria-label="Close">&times;</button>
            </div>
            <div class="up-modal-body" id="edit-modal-body"></div>
            <div class="up-modal-footer" id="edit-modal-footer">
                <button class="up-btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="up-btn-save" id="edit-modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="up-toast" id="up-toast"></div>

    <script src="../js/userpage.js"></script>
</body>
</html>
