<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart – Neko Animestore</title>
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="header-root"></div>
<div id="carousel-root"></div>

<!-- ========== MAIN ========== -->
<main class="main-content">
    <div class="container">

        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> Back</a>

        <h1 class="page-title">My Cart <span class="cart-count" id="cart-count">0</span></h1>

        <div class="cart-layout">

            <!-- LEFT: Cart Items -->
            <div class="cart-items-col">
                <div id="cart-items-list">
                    <!-- Rendered by JS -->
                </div>

                <!-- Empty State -->
                <div class="empty-cart" id="empty-cart" style="display:none;">
                    <div class="empty-icon"><i class="fas fa-shopping-bag"></i></div>
                    <p>Your cart is empty</p>
                    <a href="index.html" class="continue-btn">Continue Shopping</a>
                </div>
            </div>

            <!-- RIGHT: Order Summary -->
            <div class="summary-col" id="summary-col">
                <div class="summary-card">
                    <h2 class="summary-title">Order Summary</h2>

                    <div class="summary-rows" id="summary-items">
                        <!-- Populated by JS -->
                    </div>

                    <div class="summary-divider"></div>

                    <!-- COUPON INPUT START -->
                    <div class="coupon-section" style="margin-bottom: 20px;">
                        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:8px; color:#333;">Have a coupon?</label>
                        <div style="display:flex; gap:6px;">
                            <input type="text" id="cart-coupon-input" placeholder="Enter code" style="flex:1; min-width:0; padding:10px 10px; background:#fff; border:1px solid #ccc; color:#333; border-radius:8px; font-family:Arial, sans-serif; outline:none;">
                            <button class="paste-btn" onclick="navigator.clipboard.readText().then(t => document.getElementById('cart-coupon-input').value = t).catch(() => showToast('Unable to read clipboard', true))" style="padding:10px 12px; background:#fff; border:1px solid #82659D; color:#82659D; border-radius:8px; cursor:pointer; transition:all 0.2s; white-space:nowrap; font-weight:600;"><i class="fas fa-paste"></i> Paste</button>
                            <button class="apply-btn" onclick="applyCoupon()" style="padding:10px 12px; background:#82659D; border:1px solid #82659D; color:#fff; border-radius:8px; cursor:pointer; font-weight:600; transition:all 0.2s;">Apply</button>
                        </div>
                    </div>
                    <!-- COUPON INPUT END -->

                    <div class="summary-row total-row">
                        <span>Total</span>
                        <span id="summary-total">$0.00</span>
                    </div>

                    <button class="setup-address-btn" id="setup-address-btn">
                        <i class="fas fa-map-marker-alt"></i> Set Up Address
                    </button>
                </div>
            </div>

        </div>

    </div>
</main>

<div id="footer-root"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="../js/auth.js"></script>
<script src="../js/partials.js"></script>
<script src="../js/cart-badge.js"></script>
<script src="../js/cart.js"></script>

</body>
</html>
