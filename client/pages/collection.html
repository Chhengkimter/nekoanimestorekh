<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — Neko Animestore</title>
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/productlist.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Collection banner */
    .collection-banner {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      margin: 24px 0;
      max-height: 280px;
    }
    .collection-banner img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }
    .collection-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.5), transparent);
      display: flex;
      align-items: center;
      padding: 32px;
    }
    #collection-banner-title {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div id="header-root"></div>

<!-- MAIN -->
<main class="main-content">
  <div class="container">

    <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> Back</a>

    <!-- Banner (populated by productlist.js) -->
    <div class="collection-banner" id="collection-banner">
      <img id="collection-banner-img" src="" alt="">
      <div class="collection-banner-overlay">
        <h1 id="collection-banner-title"></h1>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid"></div>

    <!-- Empty State -->
    <div id="empty-state" style="display:none;text-align:center;padding:60px 0;color:#B99CC8">
      <i class="fas fa-box-open" style="font-size:48px;margin-bottom:16px;display:block"></i>
      <p>No products found in this collection yet.</p>
    </div>

  </div>
</main>

<div id="footer-root"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Set PAGE_FILTER from URL slug BEFORE productlist.js loads -->
<script>
  const _slug = new URLSearchParams(window.location.search).get('slug');
  if (_slug) window.PAGE_FILTER = { slug: _slug };
</script>

<script src="../js/auth.js"></script>
<script src="../js/partials.js"></script>
<script src="../js/productlist.js"></script>
<script src="../js/cart-badge.js"></script>
<script src="../js/cart.js"></script>

</body>
</html>
