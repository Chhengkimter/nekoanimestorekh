<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Neko Animestore</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <!-- LEFT PANEL -->
        <div class="auth-panel left-panel">
            <a href="index.html" class="panel-logo">
                <img src="https://i.pinimg.com/736x/d1/44/68/d14468697401a86272d2b631e6f62069.jpg" alt="Neko Logo">
                <span>Neko_Animestore</span>
            </a>
            <div class="panel-text">
                <h2>Set a new password</h2>
                <p>Choose a strong password<br>to protect your account.</p>
            </div>
            <div class="panel-decoration">
                <div class="deco-circle c1"></div>
                <div class="deco-circle c2"></div>
                <div class="deco-circle c3"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="auth-panel right-panel">
            <div class="form-card">
                <div id="reset-form-view">
                    <h1 class="form-title">Reset Password</h1>
                    <p class="expiry-note"><i class="fas fa-clock"></i> This link expires in 20 minutes</p>

                    <div class="auth-error" id="auth-error" style="display:none; margin-top: 20px;">
                        <i class="fas fa-circle-exclamation"></i>
                        <span id="auth-error-msg"></span>
                    </div>

                    <form id="reset-form" novalidate style="margin-top: 20px;">
                        <div class="field-group">
                            <label for="new-password">New Password</label>
                            <div class="input-wrap">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="new-password" placeholder="">
                                <button type="button" class="toggle-pw" id="toggle-new-pw" tabindex="-1">
                                    <i class="fas fa-eye" id="eye-new-pw"></i>
                                </button>
                            </div>
                            <div class="pw-strength">
                                <div class="pw-bar" id="pw-bar"></div>
                            </div>
                            <span class="field-error" id="new-password-error"></span>
                        </div>

                        <div class="field-group">
                            <label for="confirm-password">Confirm Password</label>
                            <div class="input-wrap">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="confirm-password" placeholder="">
                                <button type="button" class="toggle-pw" id="toggle-confirm-pw" tabindex="-1">
                                    <i class="fas fa-eye" id="eye-confirm-pw"></i>
                                </button>
                            </div>
                            <span class="field-error" id="confirm-password-error"></span>
                        </div>

                        <button type="submit" class="submit-btn" id="reset-btn">
                            <span id="reset-btn-text">Reset Password</span>
                            <span class="spinner" id="reset-spinner" style="display:none;"></span>
                        </button>
                    </form>
                </div>

                <div id="reset-status-view" style="display:none;">
                    <div class="status-content" id="reset-status-content">
                        <!-- Success or Error content injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const formView = document.getElementById('reset-form-view');
        const statusView = document.getElementById('reset-status-view');
        const statusContent = document.getElementById('reset-status-content');

        if (!token) {
            formView.style.display = 'none';
            statusView.style.display = 'block';
            statusContent.innerHTML = `
                <div class="status-icon error">
                    <i class="fas fa-times"></i>
                </div>
                <h2 class="status-title">Invalid Link</h2>
                <p class="status-message">This password reset link is invalid or missing a token.</p>
                <div class="status-actions">
                    <a href="forgot-password.html" class="submit-btn" style="text-decoration:none;">Request a new reset link</a>
                </div>
            `;
            return;
        }

        initTogglePw('toggle-new-pw', 'new-password', 'eye-new-pw');
        initTogglePw('toggle-confirm-pw', 'confirm-password', 'eye-confirm-pw');

        const newPwInput = document.getElementById('new-password');
        if (newPwInput) {
            newPwInput.addEventListener('input', (e) => {
                checkStrength(e.target.value);
            });
        }

        const form = document.getElementById('reset-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideBanners();
            clearError('new-password-error');
            clearError('confirm-password-error');
            setInputState('new-password', null);
            setInputState('confirm-password', null);

            const newPassword = newPwInput.value;
            const confirmPassword = document.getElementById('confirm-password').value;

            let hasError = false;

            if (newPassword.length < 8) {
                showError('new-password-error', 'Password must be at least 8 characters.');
                setInputState('new-password', 'input-error');
                hasError = true;
            }

            if (newPassword !== confirmPassword) {
                showError('confirm-password-error', 'Passwords do not match.');
                setInputState('confirm-password', 'input-error');
                hasError = true;
            }

            if (hasError) return;

            setLoading('reset-btn', 'reset-btn-text', 'reset-spinner', true);
            try {
                const res = await fetch(`${API}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                });
                const data = await res.json();

                if (!res.ok) {
                    if (data.error && data.error.toLowerCase().includes('expire')) {
                        formView.style.display = 'none';
                        statusView.style.display = 'block';
                        statusContent.innerHTML = `
                            <div class="status-icon error">
                                <i class="fas fa-times"></i>
                            </div>
                            <h2 class="status-title">Link Expired</h2>
                            <p class="status-message">${data.error || 'This password reset link has expired.'}</p>
                            <div class="status-actions">
                                <a href="forgot-password.html" class="submit-btn" style="text-decoration:none;">Request a new reset link</a>
                            </div>
                        `;
                    } else {
                        showBanner('error', data.error || 'Something went wrong.');
                    }
                    return;
                }

                // Show success
                formView.style.display = 'none';
                statusView.style.display = 'block';
                statusContent.innerHTML = `
                    <div class="status-icon success">
                        <i class="fas fa-check"></i>
                    </div>
                    <h2 class="status-title">Password Reset!</h2>
                    <p class="status-message">Your password has been updated. You can now log in.</p>
                    <div class="status-actions">
                        <a href="login.html" class="submit-btn" style="text-decoration:none;">Log In</a>
                    </div>
                `;

            } catch (err) {
                showBanner('error', 'Network error — make sure the server is running.');
            } finally {
                setLoading('reset-btn', 'reset-btn-text', 'reset-spinner', false);
            }
        });
    });
    </script>
</body>
</html>
